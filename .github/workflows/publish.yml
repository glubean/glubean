name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

      # Publish in dependency order. pnpm publish converts workspace:* → real versions.
      # All packages are LOCKSTEP (same version — see CLAUDE.md Version Policy); a final
      # verify step gates the job on every package actually reaching the tag version.
      # Core packages
      - name: Publish @glubean/sdk
        continue-on-error: true
        run: pnpm --filter @glubean/sdk publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # engine: shared run-loop core; depends on sdk, depended on by runner —
      # MUST publish after sdk and before runner.
      - name: Publish @glubean/engine
        continue-on-error: true
        run: pnpm --filter @glubean/engine publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @glubean/scanner
        continue-on-error: true
        run: pnpm --filter @glubean/scanner publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @glubean/redaction
        continue-on-error: true
        run: pnpm --filter @glubean/redaction publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @glubean/runner
        continue-on-error: true
        run: pnpm --filter @glubean/runner publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @glubean/cli
        continue-on-error: true
        run: pnpm --filter @glubean/cli publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Short-name wrapper (depends on @glubean/cli)
      - name: Publish glubean
        continue-on-error: true
        run: pnpm --filter glubean publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Plugin packages (lockstep — same version as core)
      - name: Publish @glubean/auth
        continue-on-error: true
        run: pnpm --filter @glubean/auth publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @glubean/browser
        continue-on-error: true
        run: pnpm --filter @glubean/browser publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @glubean/graphql
        continue-on-error: true
        run: pnpm --filter @glubean/graphql publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @glubean/mcp
        continue-on-error: true
        run: pnpm --filter @glubean/mcp publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @glubean/grpc
        continue-on-error: true
        run: pnpm --filter @glubean/grpc publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @glubean/oauth-code
        continue-on-error: true
        run: pnpm --filter @glubean/oauth-code publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Gate: fail the job RED if any package did not actually reach the tag version on
      # npm. The publish steps above keep continue-on-error so a re-run skips already-
      # published packages (E403) instead of aborting — but without this gate a real
      # publish failure (e.g. an expired NPM_TOKEN → every PUT 404s) would leave the job
      # GREEN with nothing published. Retries absorb npm read-propagation lag (a brand-new
      # package can 404 on read for a few seconds after its first publish).
      - name: Verify every package is live at the tag version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKGS="@glubean/sdk @glubean/engine @glubean/scanner @glubean/redaction @glubean/runner @glubean/cli glubean @glubean/auth @glubean/browser @glubean/graphql @glubean/mcp @glubean/grpc @glubean/oauth-code"
          echo "Verifying all packages at version $VERSION"
          FAIL=0
          for pkg in $PKGS; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              live=$(npm view "$pkg@$VERSION" version 2>/dev/null || true)
              if [ "$live" = "$VERSION" ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = 1 ]; then echo "  ok  $pkg@$VERSION"; else echo "::error::$pkg is NOT at $VERSION on npm"; FAIL=1; fi
          done
          if [ "$FAIL" != 0 ]; then echo "::error::release incomplete — one or more packages did not publish"; exit 1; fi
          echo "All ${VERSION} packages confirmed live on npm."

      # lens and skill removed — now in glubean/skill repo (Agent Skills standard)
