version: 1

defaults:
  redaction:
    replacementFormat: simple

suites:
  # Deterministic — always green. Backs the "stable stays green" story.
  api-stable:
    target: ./tests/api-stable
    kinds: [test]
  # Probabilistic 503 from the mock backend. Backs the "Glubean detects
  # flaky" story — intentionally non-deterministic.
  api-flaky:
    target: ./tests/api-flaky
    kinds: [test]
  # Contract guarding the stable API shape. Always green.
  contracts-stable:
    target: ./tests/contracts/stable
    kinds: [contract]
  # 100% in-process Math.random() canary — proves the run/reduce
  # pipeline itself is alive, independent of any backend.
  canary:
    target: ./tests/canary
    kinds: [test]

profiles:
  # `npm test` — only deterministic suites, so a fresh clone runs green.
  local:
    suites: [api-stable, contracts-stable]

  # `npm run test:full` — the complete suite incl. flaky + canary. Exit
  # code is intermittently non-zero BY DESIGN (that's the point — you
  # SEE Glubean catch flaky/degrading behavior). Runs fully local; no
  # upload, no cloud account needed.
  #
  # To publish results to a Glubean project dashboard, run
  # `glubean login` once, then `glubean run --profile full --upload
  # --project <your-project>` (or add an `upload:` block here with your
  # projectAlias). Kept opt-in so a fresh scaffold runs with zero config.
  full:
    suites: [api-stable, api-flaky, contracts-stable, canary]
    execution:
      failFast: false
      concurrency: 3
    reporters:
      console: summary
      resultJson: .glubean/results/full.result.json
